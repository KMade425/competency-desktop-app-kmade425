<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Hello World!</title>
    <!-- https://electronjs.org/docs/tutorial/security#csp-meta-tag -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
    <link href="css/index.css" rel="stylesheet" />
    <link href="css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
    <div class="cont">
        <div class="main-box">
            <div class="log">
                <div class="tear"></div>
                <h5>Welcome, please enter your correct information to log in</h5>
                <i class="fa fa-check fa-user"></i>
                <input type="text" class="user" id="username" name="" placeholder="Username" required />
                <i class="fa fa-check fa-pass"></i>
                <input type="password" class="pass" id="password" name="password" placeholder="Password" required />
                <button class="login" id="login">Log In</button>
            </div>
        </div>
    </div>
    <script src="js/index.js"></script>
</body>

</html>

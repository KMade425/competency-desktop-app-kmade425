<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <!-- https://electronjs.org/docs/tutorial/security#csp-meta-tag -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
    <link href="css/theme.css" rel="stylesheet" />
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/dashboard.css" rel="stylesheet" />
</head>

<body>
    <div class="container-fluid bg-white p-3 shadow headerDiv navbar">
        <svg style="width:24px;height:24px" viewBox="0 0 24 24" class="iconMenu" id="iconMenu">
            <path fill="#000000" d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z" />
        </svg>
        <span class="btn btn-sm btn-warning float-right" id="startExam">Start exam</span>
    </div>
    <div class="container-fluid p-0">
        <div class="d-flex align-items-stretch">
            <div class="col-3 bg-white p-0 sidebar pt-4">
                <div class="bg-white" id="menuList" page="dashboard">
                </div>
            </div>
            <div class="col-9 page-holder w-100 d-flex flex-wrap">
                <div class="container p-3">
                    <div class="row">
                        <div class="col-6">
                            <div class="bg-white shadow roundy p-4 h-80 d-flex align-items-center justify-content-between">
                                <div class="flex-grow-1 d-flex align-items-center">
                                    <div class="dot mr-3 bg-violet"></div>
                                    <div class="text">
                                        <h6 class="mb-0">Data consumed</h6><span class="text-gray">145,14 GB</span>
                                    </div>
                                </div>
                                <div class="icon text-white bg-violet">
                                    <i class="fas fa-server"></i>
                                </div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="bg-white shadow roundy p-4 h-80 d-flex align-items-center justify-content-between">
                                <div class="flex-grow-1 d-flex align-items-center">
                                    <div class="dot mr-3 bg-violet"></div>
                                    <div class="text">
                                        <h6 class="mb-0">Data consumed</h6><span class="text-gray">145,14 GB</span>
                                    </div>
                                </div>
                                <div class="icon text-white bg-violet">
                                    <i class="fas fa-server"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <video id="videotag" controls class="col-12"></video>

            </div>
        </div>
    </div>
    <div id="overlayBox" class="hidden">
        <div class="overlayblock bg-dark"></div>
        <buttons>
            <button class="btn btn-light btn-sm p-1" id="nextVideoNow">Next Video ></button>
            <button class="btn btn-primary btn-sm p-1" id="startExamNow">Start exam</button>
        </buttons>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
